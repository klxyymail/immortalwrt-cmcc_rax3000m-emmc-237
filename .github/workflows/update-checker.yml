# 描述：源码更新自动检测工作流（获取两次哈希间完整更新日志）
#

name: 固件源码更新检测器

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6  # 源码仓库URL
  REPO_BRANCH: openwrt-24.10-6.6  # 监控分支

# 工作流触发条件
on:
  schedule:
    - cron: 0 18 * * *  # 定时触发：每天UTC时间18点（北京时间凌晨2点）自动执行
  workflow_dispatch:  # 允许手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 获取最新提交哈希
        id: getHash
        run: |
          git init
          git remote add origin "${REPO_URL}"
          git fetch --depth 100 origin "${REPO_BRANCH}" || git fetch origin "${REPO_BRANCH}"
          COMMIT_HASH=$(git rev-parse origin/${REPO_BRANCH})
          echo "commitHash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          
      - name: 对比提交哈希
        id: cacheHash
        uses: actions/cache@v4
        with:
          path: .commitHash
          key: HEAD-${{ steps.getHash.outputs.commitHash }}
      
      - name: 获取详细更新日志
        id: getCommitInfo
        run: |
          if [ "${{ steps.cacheHash.outputs.cache-hit }}" != 'true' ]; then
              echo "开始执行源码更新检测..."
              echo "目标仓库：${REPO_URL}"
              echo "分支：${REPO_BRANCH}"
              COMMIT_HASH=${{ steps.getHash.outputs.commitHash }}
              echo "最新提交哈希：${COMMIT_HASH}"
              
              # 标记是否存在有效更新
              HAS_UPDATE="false"
              
              if [ -f .commitHash ]; then
                LAST_HASH=$(cat .commitHash)
                echo "上次记录的哈希值：${LAST_HASH}"

                # ========== 新增核心修复：新旧哈希完全相等直接退出 ==========
                if [ "${LAST_HASH}" = "${COMMIT_HASH}" ]; then
                  echo "新旧提交哈希完全一致，源码无任何更新，跳过日志拉取"
                  echo "commitLogs<<EOF" >> ${GITHUB_OUTPUT}
                  echo "" >> ${GITHUB_OUTPUT}
                  echo "EOF" >> ${GITHUB_OUTPUT}
                  exit 0
                fi
                
                echo "正在获取两次提交之间的更新日志..."
                try_count=0
                max_tries=3
                COMMIT_LOGS=""
                
                while [ $try_count -lt $max_tries ]; do
                  if git log --pretty=format:"%h: %s %ad" --date=format:"%Y-%m-%d %H:%M:%S" ${LAST_HASH}..${COMMIT_HASH} > /tmp/commit_logs.txt 2>/dev/null; then
                    COMMIT_LOGS=$(cat /tmp/commit_logs.txt)
                    # 判断日志是否为空，为空说明区间无提交
                    if [ -z "${COMMIT_LOGS}" ]; then
                      echo "两次哈希区间无提交记录，源码未更新"
                      COMMIT_LOGS=""
                    else
                      HAS_UPDATE="true"
                    fi
                    break
                  else
                    try_count=$((try_count+1))
                    echo "尝试 $try_count: 无法直接获取两次哈希之间的日志，可能是提交历史超过了获取深度。"
                    
                    git log -10 --pretty=format:"%h: %s %ad" --date=format:"%Y-%m-%d %H:%M:%S" origin/${REPO_BRANCH} > /tmp/commit_logs.txt
                    COMMIT_LOGS=$(cat /tmp/commit_logs.txt)
                    
                    if [ $try_count -eq $max_tries ]; then
                      echo "已获取最新的10条提交日志作为备选。"
                      HAS_UPDATE="true"
                      break
                    fi
                    
                    git fetch --depth $((100 * (try_count + 1))) origin "${REPO_BRANCH}"
                  fi
                done
              else
                echo "首次运行，无历史哈希记录，获取最新的10条提交日志。"
                COMMIT_LOGS=$(git log -10 --pretty=format:"%h: %s %ad" --date=format:"%Y-%m-%d %H:%M:%S" origin/${REPO_BRANCH})
                HAS_UPDATE="true"
              fi
              
              echo "成功获取更新日志："
              echo "${COMMIT_LOGS}"
              # 日志为空则直接输出空，避免无效参数
              if [ -z "${COMMIT_LOGS}" ]; then
                COMMIT_LOGS_SINGLE=""
              else
                COMMIT_LOGS_SINGLE=$(echo "$COMMIT_LOGS" | tr '\n\r' '|' | sed 's/|||*/|||/g')
              fi
              echo "commitLogs<<EOF" >> ${GITHUB_OUTPUT}
              echo "${COMMIT_LOGS_SINGLE}" >> ${GITHUB_OUTPUT}
              echo "EOF" >> ${GITHUB_OUTPUT}
          else
              echo "缓存命中，源码无更新，跳过日志拉取"
              echo "commitLogs<<EOF" >> ${GITHUB_OUTPUT}
              echo "" >> ${GITHUB_OUTPUT}
              echo "EOF" >> ${GITHUB_OUTPUT}
          fi
      - name: 保存新提交哈希
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.getHash.outputs.commitHash }} | tee .commitHash
      
      - name: 触发构建镜像
        id: compile
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          # 二次校验：更新日志为空直接退出，不触发构建
          if [[ -z "${{ steps.getCommitInfo.outputs.commitLogs }}" ]]; then
            echo "更新日志为空，源码无变更，放弃触发构建"
            exit 0
          fi

          echo "=== 安装jq工具用于解析JSON ==="
          sudo apt-get update
          sudo apt-get install -y jq
          echo "✅ jq工具安装完成"
          echo "当前jq版本：$(jq --version)"
          echo "=== 开始触发构建镜像工作流 ==="
          ESCAPED_COMMIT_LOGS=$(echo "${{ steps.getCommitInfo.outputs.commitLogs }}" | jq -Rsa .)
          BUILD_TRIGGER_PAYLOAD=$(cat << EOF
          {
            "event_type": "自动构建集成固件依赖镜像",
            "client_payload": {
              "inputs": {
                "repo_url": "${{ env.REPO_URL }}",
                "repo_branch": "${{ env.REPO_BRANCH }}",
                "commit_hash": "${{ steps.getHash.outputs.commitHash }}",
                "commit_logs": ${ESCAPED_COMMIT_LOGS},
                "trigger_source": "检测固件源码更新"
              }
            }
          }
          EOF
          )
          
          # 发送请求触发工作流
          RESPONSE=$(curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "$BUILD_TRIGGER_PAYLOAD" 2>&1)
          
          # 检查触发结果
          if [ $? -eq 0 ]; then
            echo "✅ 构建镜像工作流已成功触发"
            echo "触发参数:"
            echo "  - 固件源码URL: $(echo "$BUILD_TRIGGER_PAYLOAD" | jq -r '.client_payload.inputs.repo_url')"
            echo "  - 固件源码分支: $(echo "$BUILD_TRIGGER_PAYLOAD" | jq -r '.client_payload.inputs.repo_branch')"
            echo "  - 最新哈希值: $(echo "$BUILD_TRIGGER_PAYLOAD" | jq -r '.client_payload.inputs.commit_hash')"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 构建容器工作流触发失败！"
            echo "错误信息: $RESPONSE"
            # 不中断流程，仅记录错误
          fi
      - name: 清理旧工作流记录
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 3  # 仅保留3天内的记录
          keep_minimum_runs: 3  # 最少保留3条记录（避免清空）
